<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>导览后台</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-page="admin">
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Guide Console</p>
          <h1>颐和园导览后台</h1>
        </div>
        <a class="button secondary" href="/">游客端</a>
      </header>

      <section class="admin-layout">
        <div class="panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">POI</p>
              <h2>景点数据</h2>
            </div>
            <span id="adminCount" class="status-pill">0 项</span>
          </div>
          <div id="poiTable" class="table-list"></div>
        </div>

        <form id="poiForm" class="panel edit-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Editor</p>
              <h2>编辑景点</h2>
            </div>
          </div>
          <div class="form-grid">
            <div class="input-stack">
              <label for="poiId">ID</label>
              <input id="poiId" required />
            </div>
            <div class="input-stack">
              <label for="poiName">中文名</label>
              <input id="poiName" required />
            </div>
            <div class="input-stack">
              <label for="poiNameEn">英文名</label>
              <input id="poiNameEn" />
            </div>
            <div class="input-stack">
              <label for="poiTags">标签</label>
              <input id="poiTags" placeholder="建筑,历史" />
            </div>
            <div class="input-stack">
              <label for="poiX">地图 X</label>
              <input id="poiX" type="number" min="0" max="100" />
            </div>
            <div class="input-stack">
              <label for="poiY">地图 Y</label>
              <input id="poiY" type="number" min="0" max="100" />
            </div>
          </div>
          <div class="input-stack">
            <label for="poiSummary">简短讲解</label>
            <textarea id="poiSummary" rows="3"></textarea>
          </div>
          <div class="input-stack">
            <label for="poiStory">历史故事</label>
            <textarea id="poiStory" rows="6"></textarea>
          </div>
          <button class="button primary wide" type="submit">保存 POI</button>
          <p id="saveStatus" class="save-status"></p>
        </form>
      </section>
    </main>
    <script src="/static/admin.js"></script>
  </body>
</html>

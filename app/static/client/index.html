<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>颐和园 AI 导览</title>
    <link rel="stylesheet" href="/static/client/styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="颐和园 AI 导览手机端">
        <section class="map-hero" aria-label="实时地图">
          <div id="baiduMap" class="baidu-map" hidden></div>
          <div id="fallbackMap" class="fallback-map">
            <i class="corner-ornament corner-tl"></i>
            <i class="corner-ornament corner-tr"></i>
            <i class="corner-ornament corner-bl"></i>
            <i class="corner-ornament corner-br"></i>
            <div class="paper-map-layer land-west"></div>
            <div class="paper-map-layer land-east"></div>
            <div class="lake"></div>
            <svg class="route-svg" viewBox="0 0 360 680" role="img" aria-label="颐和园路线示意">
              <path class="map-road road-main" d="M86 40 C126 92 130 148 104 212 C80 272 78 342 118 396 C160 452 158 520 116 612" />
              <path class="map-road road-east" d="M232 34 C218 110 222 186 254 248 C286 310 300 398 268 476 C244 534 246 596 292 650" />
              <path class="map-road bridge-road" d="M72 544 C126 522 184 518 238 535 C270 546 294 566 318 596" />
              <path class="bridge-arch" d="M118 563 C158 540 219 543 260 574" />
              <path class="bridge-arch small" d="M132 569 C165 554 213 556 247 579" />
              <path class="route-path" d="M202 185 C184 200 182 224 196 241 C215 264 246 268 250 294 C254 320 235 346 208 361" />
              <path class="route-point start current-knot" d="M180 244c4.4 5.2 9.6 5.2 15.4.2-2.1 6.9-.2 11.5 5.5 13.8-6.2 2.7-8 7.4-5.2 14-6.1-3.6-11.4-2.3-15.7 3.7-4.4-6-9.6-7.3-15.8-3.7 2.8-6.6 1.1-11.3-5.2-14 5.8-2.3 7.6-6.9 5.5-13.8 5.9 5 11 5 15.5-.2Z" />
              <path class="current-knot-line" d="M169 259c5.4-6.7 16.8-6.7 22.2 0M172 266c5.2 3.6 10.6 3.6 15.8 0M180 267v16" />
              <path class="route-point dest palace-pin" d="M250 300c7.8 0 14.1 6.2 14.1 14 0 9.7-14.1 19.3-14.1 19.3s-14.1-9.6-14.1-19.3c0-7.8 6.3-14 14.1-14Z" />
              <g class="map-building tower-a">
                <path d="M56 520h76M66 506h56M74 492h40M82 478h24" />
                <path d="M62 520v24h64v-24M78 520v-16M110 520v-16" />
              </g>
              <g class="map-building tower-b">
                <path d="M250 84h72M260 70h52M270 56h32" />
                <path d="M258 84v25h56V84" />
              </g>
            </svg>
            <span class="map-label label-yuquan">玉泉山路</span>
            <span class="map-label label-west">西山公园</span>
            <span class="map-label label-group">群组阁景区</span>
            <span class="map-label label-willow">西堤古柳</span>
            <span class="map-label label-dehe">德和园大戏楼</span>
            <span class="map-label label-lake">昆明湖</span>
            <span class="map-label label-bridge">十七孔桥</span>
            <span class="map-label label-island">南湖岛</span>
          </div>

          <header class="topbar">
            <div>
              <p class="eyebrow">SUMMER PALACE GUIDE</p>
              <h1>颐和园导览</h1>
              <p class="subtitle"><span>皇家园林</span><span>山水长卷</span></p>
            </div>
            <div class="status-pill" id="wsStatus">
              <span class="status-dot"></span>
              <span>连接中</span>
            </div>
          </header>

          <div class="map-chip map-chip-left">当前位置</div>
          <div class="map-chip map-chip-right" id="mapDestination">目的地</div>
          <div class="compass">
            <span>NE</span>
            <strong id="headingValue">85°</strong>
          </div>

          <section class="route-sheet" aria-label="导航状态">
            <div class="route-main">
              <span id="navStatus">导航中</span>
              <strong id="distanceValue">634m</strong>
              <em>距离下一转弯</em>
            </div>
            <div class="route-sub">
              <span>当前步骤</span>
              <strong id="stepValue">1/3</strong>
              <em>请按路线前行</em>
            </div>
            <button class="round-button" id="refreshLocationBtn" title="更新位置" aria-label="更新位置">
              <svg viewBox="0 0 24 24"><path d="M12 4v3m0 10v3M4 12h3m10 0h3M7.8 7.8l2.1 2.1m4.2 4.2 2.1 2.1m0-8.4-2.1 2.1m-4.2 4.2-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </section>
        </section>

        <div class="route-progress" aria-label="路线进度">
          <span class="route-progress-fill"></span>
          <span class="route-progress-pin"></span>
        </div>

        <p class="spoken guide-narration" id="mainNarration">万寿山前风平，导览待命。</p>
        <div class="suggestions guide-suggestions" id="suggestions"></div>

        <section class="content">
          <section class="view active guide-view" data-view="guide" aria-label="导览地图"></section>

          <section class="view" data-view="ask">
            <div class="section-head">
              <div>
                <p class="kicker">Conversation</p>
                <h2>语音问答</h2>
              </div>
              <span class="mini-label" id="intentLabel">intent: --</span>
            </div>
            <form class="chat-form" id="chatForm">
              <label for="chatInput">游客语音文本</label>
              <div class="input-row">
                <input id="chatInput" name="chatInput" value="我想去最近的厕所" autocomplete="off" />
                <button type="submit" class="send-button" aria-label="发送">
                  <svg viewBox="0 0 24 24"><path d="M4 12 20 5l-5 14-3-6-8-1Z"/></svg>
                </button>
              </div>
            </form>
            <button class="wide-command" id="ragBtn">
              <span>追问：这个建筑为什么有三层？</span>
              <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 0 7 7"/><path d="M12 9v4l3 2M17 3v4h4"/></svg>
            </button>
          </section>

          <section class="view" data-view="vision">
            <div class="section-head">
              <div>
                <p class="kicker">Glasses View</p>
                <h2>眼镜画面</h2>
              </div>
              <span class="mini-label">mock frame</span>
            </div>
            <div class="vision-preview">
              <div class="scan-line"></div>
              <div class="target-box">德和园大戏楼</div>
            </div>
            <div class="action-grid two">
              <button class="action primary" id="gestureBtn">
                <svg viewBox="0 0 24 24"><path d="M7 12V6a2 2 0 0 1 4 0v5"/><path d="M11 11V5a2 2 0 0 1 4 0v7"/><path d="M15 12V8a2 2 0 0 1 4 0v6a6 6 0 0 1-12 0v-2"/></svg>
                <span>V 字拍照</span>
              </button>
              <button class="action" id="wakeQuestionBtn">
                <svg viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 0-6-6"/><path d="M8 18h8M12 14v4"/></svg>
                <span>唤醒提问</span>
              </button>
            </div>
          </section>

          <section class="view" data-view="events">
            <div class="section-head">
              <div>
                <p class="kicker">Realtime</p>
                <h2>实时事件</h2>
              </div>
              <button class="text-button" id="clearEventsBtn">清空</button>
            </div>
            <ol class="event-list" id="eventList"></ol>
          </section>
        </section>

        <nav class="tabbar" aria-label="页面导航">
          <button class="tab active" data-switch="guide">
            <svg viewBox="0 0 24 24"><path d="M5 19 19 5M7 7h10v10"/></svg>
            <span>导览</span>
          </button>
          <button class="tab" data-switch="ask">
            <svg viewBox="0 0 24 24"><path d="M5 6h14v10H8l-3 3V6Z"/><path d="M8 9h8M8 12h5"/></svg>
            <span>问答</span>
          </button>
          <button class="tab" data-switch="vision">
            <svg viewBox="0 0 24 24"><path d="M4 8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>眼镜</span>
          </button>
          <button class="tab" data-switch="events">
            <svg viewBox="0 0 24 24"><path d="M6 5h12M6 12h12M6 19h12"/></svg>
            <span>事件</span>
          </button>
        </nav>
      </section>
    </main>

    <script src="/static/client/app.js"></script>
  </body>
</html>
